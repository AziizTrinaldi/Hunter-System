<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunter System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: launcher dashboard — left icon rail, main column (greeting bar + view), right rail (shadow army + quick potions) */
:root{
  color-scheme: dark;
  --bg:#1c1115;
  --rail:#22151a;
  --card:#2c1c22;
  --card-2:#37232a;
  --card-3:#442c34;
  --line:rgba(255,218,214,.07);
  --line-2:rgba(255,218,214,.15);
  --fg:#f8ece9;
  --muted:#c4a9aa;
  --dim:#8f7579;
  --coral:#ef8b7d;
  --coral-2:#f7b6a6;
  --coral-deep:#b85a58;
  --gold:#f1cc8f;
  --mint:#94d8bc;
  --lav:#bca8f2;
  --sky:#95c7ef;
  --rose:#f08899;
  --f-display:'Sora','Segoe UI',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(900px 520px at 18% -12%,rgba(239,139,125,.13),transparent 60%),radial-gradient(800px 600px at 105% 105%,rgba(188,168,242,.07),transparent 60%);background-attachment:fixed}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{text-wrap:balance}
.px{image-rendering:pixelated;display:block;flex:none}
.muted{color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:78px minmax(0,1fr) 78px;min-height:100vh}
.lrail,.rrail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0;background:var(--rail)}
.lrail{border-right:1px solid var(--line);z-index:30}
.rrail{border-left:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.rrail::-webkit-scrollbar{display:none}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--coral),var(--coral-deep));display:grid;place-items:center;margin-bottom:14px;box-shadow:0 8px 20px rgba(239,139,125,.25)}
.nav{display:flex;flex-direction:column;gap:8px;align-items:center}
.nav-btn{position:relative;width:46px;height:46px;border-radius:15px;border:0;background:transparent;color:var(--dim);display:grid;place-items:center;transition:background .2s,color .2s}
.nav-btn:hover{color:var(--fg);background:var(--card)}
.nav-btn.on{color:var(--coral);background:var(--card-2)}
.nav-btn.on::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--coral)}
.nav-btn svg,.icon-btn svg,.rr-h svg,.sicon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nbadge{position:absolute;top:5px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--coral);color:#3a1a1f;font:700 10px/16px var(--f-display);text-align:center}
.rail-sp{flex:1}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--coral);color:#3a1a1f;display:grid;place-items:center;box-shadow:0 8px 22px rgba(239,139,125,.35);transition:transform .15s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:20px;height:20px;fill:currentColor}

.main{min-width:0;padding:22px 28px 44px;display:flex;flex-direction:column;gap:22px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.greet{min-width:0;flex:1 1 220px}
.greet h1{margin:0;font:600 22px/1.2 var(--f-display);letter-spacing:-.01em}
.greet h1 span{color:var(--coral)}
.greet p{margin:3px 0 0;color:var(--muted);font-size:13px}
.xp-pill{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:999px;min-width:0;flex:0 1 320px}
.xp-pill b{font:600 13px/1 var(--f-display);white-space:nowrap}
.xp-pill .mini{flex:1;height:6px;border-radius:9px;background:var(--card-3);overflow:hidden;min-width:50px}
.xp-pill .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:9px}
.xp-pill span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:600 13px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-timer{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:0;background:rgba(239,139,125,.16);color:var(--coral-2);font:600 13px/1 var(--f-display);font-variant-numeric:tabular-nums}
.mini-timer i{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);transition:color .2s}
.icon-btn:hover{color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .nbadge{top:-3px;right:-3px}
.avatar{width:42px;height:42px;border-radius:50%;border:2px solid var(--coral);background:var(--card-2);overflow:hidden;display:flex;justify-content:center;padding:0}
.avatar .px{margin-top:3px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{margin:0;font:600 17px/1.2 var(--f-display)}
.link{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0}
.link:hover{color:var(--coral)}
.colstack{display:flex;flex-direction:column;gap:22px;min-width:0}
.empty{padding:18px;border-radius:18px;border:1.5px dashed var(--line-2);color:var(--muted);font-size:13px;text-align:center}
.sec-t{margin:20px 0 10px;font:600 12px/1 var(--f-display);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sec-t:first-child{margin-top:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font:600 13px/1 var(--f-display);background:var(--card-3);color:var(--fg);transition:transform .1s,filter .2s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.coral{background:var(--coral);color:#3a1a1f}
.btn.light{background:#fff4ef;color:#5a2a33}
.btn.glass{background:rgba(40,16,22,.28);color:#fff3ee;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.danger{background:rgba(240,136,153,.14);color:var(--rose)}
.btn.goldb{background:rgba(241,204,143,.16);color:var(--gold)}
.btn.sm{padding:8px 14px;font-size:12px}
.btn.xs{padding:6px 11px;font-size:11px}
.btn svg{width:15px;height:15px;fill:currentColor}
.btn:focus-visible,.nav-btn:focus-visible,.fab:focus-visible,.icon-btn:focus-visible,.cat:focus-visible,.slot:focus-visible,.gcard:focus-visible,.rw:focus-visible,.gpin:focus-visible,.link:focus-visible,.seg button:focus-visible{outline:2px solid var(--coral-2);outline-offset:2px}

.bar-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar-l span:last-child{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--card-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c);transition:width .4s}
.bar.xp{--c:linear-gradient(90deg,var(--coral),var(--gold))}
.bar.hp{--c:var(--rose)}
.bar.mp{--c:var(--sky)}
.bars{display:flex;flex-direction:column;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,248,244,.94);color:#5a2a33;font:600 12px/1 var(--f-display);white-space:nowrap}
.tag.glass{background:rgba(40,16,22,.3);color:#fff3ee;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.tag.soft{background:var(--card-2);color:var(--muted)}
.rar{display:inline-block;padding:3px 9px;border-radius:999px;font:600 10px/1.3 var(--f-display);background:color-mix(in srgb,var(--rc) 18%,transparent);color:var(--rc);letter-spacing:.03em}
.bon{font-size:12px;color:var(--mint)}
.ibox{--rc:#cdb8b4;width:52px;height:52px;flex:none;border-radius:15px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc) 30%,var(--card-3)),var(--card-3) 75%)}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:22px;align-items:start}
.home .span-r{grid-row:span 2}
.hero-card{position:relative;border-radius:var(--r-xl);padding:26px 28px;min-height:330px;
  background:radial-gradient(90% 125% at 82% 42%,#e7998b 0%,#c26f6e 30%,#7f3f49 62%,#4a2731 100%);box-shadow:0 22px 44px rgba(10,2,6,.3)}
.hero-deco{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.hero-deco i{position:absolute;border-radius:50%}
.hero-deco .c1{width:320px;height:320px;right:2%;top:50%;transform:translateY(-50%);background:radial-gradient(circle,rgba(255,232,222,.32),rgba(255,232,222,0) 66%)}
.hero-deco .c2{width:420px;height:420px;right:-6%;top:50%;transform:translateY(-50%);border:1px solid rgba(255,240,235,.14)}
.hero-deco .c3{width:540px;height:540px;right:-14%;top:50%;transform:translateY(-50%);border:1px solid rgba(255,240,235,.08)}
.hero-l{position:relative;z-index:2;max-width:58%;display:flex;flex-direction:column;gap:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.hero-title{margin:0;font:700 28px/1.1 var(--f-display);letter-spacing:-.02em;color:#fff7f3}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(40,16,22,.3);gap:2px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:rgba(255,243,238,.78);padding:7px 14px;border-radius:999px;font:600 12px/1 var(--f-display)}
.seg button[aria-pressed="true"]{background:#fff4ef;color:#5a2a33}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.t-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.t-time{font:600 66px/1 var(--f-display);letter-spacing:-.03em;color:#fffaf7;font-variant-numeric:tabular-nums}
.t-mode{font:600 13px/1 var(--f-display);color:rgba(255,243,238,.82)}
.tprog{height:6px;border-radius:9px;background:rgba(40,16,22,.3);overflow:hidden}
.tprog i{display:block;height:100%;width:0;background:#fff4ef;border-radius:9px;transition:width .3s linear}
.pill-input{width:100%;border-radius:999px;border:1px solid rgba(255,240,235,.22);background:rgba(40,16,22,.26);color:#fff;padding:11px 18px;outline:none}
.pill-input::placeholder{color:rgba(255,235,228,.62)}
.pill-input:focus{border-color:rgba(255,240,235,.7)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reward-note{font-size:12px;color:rgba(255,240,235,.85)}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:8px;height:8px;border-radius:50%;background:rgba(255,240,235,.3)}
.pip.on{background:#fff4ef}
.hero-char{position:absolute;right:6%;bottom:26px;z-index:1;display:flex;flex-direction:column;align-items:center}
.pedestal{width:180px;height:24px;border-radius:50%;background:radial-gradient(closest-side,rgba(50,14,24,.55),transparent);margin-top:-14px}
.hero-wrap{display:inline-block;line-height:0}
.hero-wrap .hero{filter:drop-shadow(0 0 2px var(--aura)) drop-shadow(0 10px 16px rgba(30,8,14,.35));animation:bob 1.3s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--card-2)}
.qrow.main{background:linear-gradient(120deg,rgba(239,139,125,.22),var(--card-2) 72%)}
.qthumb{width:46px;height:46px;border-radius:14px;background:var(--card-3);display:grid;place-items:center}
.qrow h4{margin:0;font:600 13px/1.3 var(--f-display)}
.qbar{height:5px;border-radius:9px;background:var(--card-3);margin-top:7px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--coral);border-radius:9px}
.qrow.done .qbar i{background:var(--mint)}
.qrw{font-size:11px;color:var(--muted);margin-top:5px}
.qright{font:600 12px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.pill-ok{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(148,216,188,.15);color:var(--mint);font:600 11px/1 var(--f-display)}
.q-note{margin-top:12px;padding:10px 14px;border-radius:14px;font-size:12px;line-height:1.45}
.q-note.warn{background:rgba(240,136,153,.1);color:#f4b3bd}
.q-note.ok{background:rgba(148,216,188,.1);color:var(--mint)}

.gscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scrollbar-color:var(--card-3) transparent}
.gcard{--rc:#cdb8b4;border-radius:22px;padding:14px;border:1px solid var(--line);background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 28%,var(--card-2)) 0%,var(--card-2) 66%);display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--fg);min-width:0;transition:transform .15s}
.gcard:hover{transform:translateY(-2px)}
.gcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.gcard .rk{font:700 34px/1 var(--f-display);color:var(--rc)}
.gcard h4{margin:4px 0 0;font:600 14px/1.3 var(--f-display)}
.gcard.locked{filter:grayscale(.75);opacity:.6}
.gcard .mobs{display:flex;gap:5px;margin-top:2px}
.gcard .mobs span{width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.2);display:grid;place-items:center}

.ring-box{position:relative;width:196px;height:196px;margin:2px auto 6px;max-width:100%}
.ring-box svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.ring-c small{color:var(--muted);font-size:12px}
.ring-c b{font:700 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.ring-c span{font-size:12px;color:var(--coral-2)}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.ms{--c:var(--coral);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;background:var(--card-2);text-align:center;min-width:0}
.ms .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent)}
.ms b{font:600 15px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ms small{font-size:11px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px;margin:18px 0 16px}
.wb{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wb i{display:block;width:100%;max-width:22px;border-radius:7px;background:var(--card-3);min-height:4px}
.wb i.met{background:linear-gradient(180deg,var(--coral-2),var(--coral))}
.wb span{font-size:10px;color:var(--dim);line-height:12px}
.wb.today span{color:var(--coral);font-weight:600}

.slist{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--card-2)}
.sicon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card-3)}
.sicon.ok{color:var(--mint)} .sicon.fail{color:var(--rose)}
.srow h4{margin:0;font:600 14px/1.3 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{padding:5px 10px;border-radius:999px;font:600 11px/1 var(--f-display);white-space:nowrap}
.st.ok{background:rgba(148,216,188,.14);color:var(--mint)}
.st.fail{background:rgba(240,136,153,.14);color:var(--rose)}
.dur{font:600 13px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- right rail ---------- */
.rr-h{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--lav);background:rgba(188,168,242,.12);margin-bottom:6px}
.army{display:flex;flex-direction:column;gap:10px;align-items:center}
.ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(188,168,242,.55);background:radial-gradient(circle at 50% 40%,rgba(188,168,242,.3),var(--card-2) 72%)}
.ava .px{filter:drop-shadow(0 0 3px rgba(188,168,242,.8))}
.ava.empty{border:1.5px dashed var(--line-2);background:transparent}
.ava.lock{border:1.5px dashed var(--line-2);background:transparent;color:var(--dim);font:600 9px/1.1 var(--f-display);text-align:center}
.qbtn{position:relative;width:46px;height:46px;border-radius:15px;border:0;background:var(--card);display:grid;place-items:center;transition:background .2s}
.qbtn:hover:not(:disabled){background:var(--card-2)}
.qbtn:disabled{opacity:.35;cursor:not-allowed}
.qbtn b{position:absolute;bottom:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--card-3);font:700 10px/18px var(--f-display);padding:0 4px;text-align:center}
.quick{display:flex;flex-direction:column;gap:12px;align-items:center}

/* ---------- character ---------- */
.char{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.doll{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.slots-col{display:flex;flex-direction:column;gap:14px}
.slot{--rc:var(--line-2);width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);font:600 11px/1 var(--f-display)}
.slot .sb{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc) 24%,var(--card-2)),var(--card-2) 75%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 70%,transparent);transition:box-shadow .2s}
.slot.empty .sb{background:var(--card-2);box-shadow:none;border:1.5px dashed var(--line-2)}
.slot.sel{color:var(--fg)}
.slot.sel .sb{box-shadow:inset 0 0 0 2px var(--coral),0 0 0 4px rgba(239,139,125,.15)}
.stage-c{position:relative;min-height:340px;border-radius:24px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;
  background:radial-gradient(ellipse 55% 7% at 50% 88%,rgba(40,10,20,.6),transparent 70%),radial-gradient(circle at 50% 44%,rgba(239,139,125,.3),transparent 60%),var(--card-2)}
.stage-c .tag{position:absolute;top:14px;left:14px;z-index:4}
.stage-c .hero-wrap{position:relative;z-index:3}
.sil{position:absolute;bottom:38px;z-index:1;opacity:.75;filter:drop-shadow(0 0 6px rgba(188,168,242,.9));animation:bob 1.6s steps(2) infinite}
.sil.back{z-index:0;opacity:.45;bottom:56px}
.ilist{display:flex;flex-direction:column;gap:10px}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--card-2)}
.irow h4{margin:0 0 4px;font:600 14px/1.25 var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attr{display:grid;grid-template-columns:44px minmax(0,1fr) auto 34px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.attr:last-child{border-bottom:0}
.attr .ab{font:700 13px/1 var(--f-display);color:var(--coral-2)}
.attr .nm{font-weight:600}
.attr .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.attr .v{font:600 17px/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.attr .v em{font-style:normal;font-size:12px;color:var(--mint);margin-left:4px}
.plus{width:32px;height:32px;border-radius:50%;border:0;background:rgba(241,204,143,.16);color:var(--gold);font:700 16px/1 var(--f-display)}
.plus:disabled{opacity:.25;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{padding:12px 14px;border-radius:16px;background:var(--card-2);min-width:0}
.tile small{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.tile b{font:600 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bagi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--card-2);min-width:0}
.bagi .ibox{width:42px;height:42px;border-radius:12px}
.bagi div{min-width:0;flex:1}
.bagi b{display:block;font:600 13px/1.2 var(--f-display)}
.pts-note{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(241,204,143,.12);color:var(--gold);font-size:13px;font-weight:600;margin-top:14px}
.shd-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.shd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:rgba(188,168,242,.1);font-size:13px}
.shd .px{filter:drop-shadow(0 0 4px rgba(188,168,242,.8))}
.shd span{flex:1;min-width:0}
.shd b{font:600 12px/1 var(--f-display);color:var(--lav)}

/* ---------- shop ---------- */
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat{border:0;padding:9px 15px;border-radius:999px;background:var(--card-2);color:var(--muted);font:600 12px/1 var(--f-display)}
.cat[aria-pressed="true"]{background:var(--coral);color:#3a1a1f}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item{--rc:#cdb8b4;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;background:var(--card-2);border:1px solid var(--line);min-width:0}
.item.eqd{box-shadow:inset 0 0 0 1.5px var(--mint)}
.item-h{display:flex;gap:12px;align-items:center}
.item-h>div{min-width:0}
.item h4{margin:0 0 5px;font:600 15px/1.25 var(--f-display)}
.item p{margin:0;font-size:13px;color:var(--muted);flex:1}
.item .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{display:inline-flex;align-items:center;gap:6px;font:600 14px/1 var(--f-display);color:var(--gold)}
.req{font-size:12px;color:var(--rose)}
.rr-form{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:10px;margin-top:16px}
.input{width:100%;border-radius:14px;border:1px solid var(--line-2);background:var(--card-2);padding:11px 14px;outline:none}
.input:focus{border-color:var(--coral)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding:6px 0}
.check input{width:18px;height:18px;accent-color:var(--coral)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- gates ---------- */
.gate-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gate-head p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
.map{position:relative;border-radius:24px;overflow:hidden;line-height:0;background:#24161b}
.map-img{width:100%;height:auto}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(20,8,12,.55))}
.dlabel{position:absolute;transform:translate(-50%,-50%);font:600 10px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,226,220,.5);pointer-events:none;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.6);z-index:1}
.gpin{position:absolute;transform:translate(-50%,-62%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;line-height:1}
.gpin .gport{filter:drop-shadow(0 0 5px var(--rc));animation:gpulse 1.8s ease-in-out infinite}
.gpin .glab{font:700 11px/1 var(--f-display);padding:4px 8px;border-radius:999px;background:rgba(28,17,21,.9);border:1px solid var(--rc);color:var(--rc);white-space:nowrap}
.gpin:hover .glab,.gpin.sel .glab{background:var(--rc);color:#2a1418}
.gpin.locked .gport{animation:none;opacity:.7;filter:none}
@keyframes gpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gate-info{--rc:var(--line-2);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px;margin-top:14px;border-radius:22px;background:linear-gradient(110deg,color-mix(in srgb,var(--rc) 20%,var(--card-2)),var(--card-2) 62%)}
.gate-info h4{margin:0;font:600 16px/1.25 var(--f-display)}
.gate-info p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.gate-info.none{display:block;text-align:center;color:var(--muted);font-size:13px}
.mob-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mob-row span{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.2)}
.mob-row span.bs{box-shadow:inset 0 0 0 1.5px var(--rose)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.lgd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.lgd i{width:10px;height:10px;border-radius:50%;background:var(--rc)}

/* ---------- battle ---------- */
.arena{display:grid;gap:14px}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:240px;padding:20px 10% 40px;border-radius:24px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 12%,rgba(239,139,125,.28),transparent 60%),linear-gradient(180deg,#3d222a,#2a171d)}
.stage.red{background:radial-gradient(ellipse at 50% 12%,rgba(240,100,120,.42),transparent 60%),linear-gradient(180deg,#4c1a25,#2e1016)}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:40px;z-index:0;background:linear-gradient(180deg,rgba(255,205,195,.2),transparent 3px),repeating-linear-gradient(90deg,#3c252c 0 22px,#331f25 22px 23px)}
.fighter{position:relative;z-index:1;line-height:0}
.fighter .mon{filter:drop-shadow(0 8px 10px rgba(20,4,8,.4));animation:bob 1.1s steps(2) infinite}
.fighter.boss .mon{filter:drop-shadow(0 0 6px rgba(240,136,153,.8)) drop-shadow(0 8px 10px rgba(20,4,8,.4))}
.fighter.hit{animation:shake .32s}
.fighter.hit .mon{animation:flash .32s}
.fighter.hurt{animation:shake .32s}
.fighter.hurt .hero{animation:hurt .4s}
.fighter.down{opacity:.3;filter:grayscale(1);transform:translateY(6px)}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes flash{30%{filter:brightness(3) saturate(0)}}
@keyframes hurt{30%{filter:brightness(1.4) sepia(1) hue-rotate(-50deg) saturate(5)}}
.vs{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:700 24px/1 var(--f-display);letter-spacing:.12em;color:rgba(255,236,230,.22)}
.foe-info{display:grid;gap:8px;padding:14px 16px;border-radius:20px;background:var(--card-2)}
.foe-info h4{margin:0;font:600 17px/1.2 var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.me-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.log{height:200px;overflow-y:auto;padding:14px 16px;border-radius:18px;background:#211418;font-size:13px;line-height:1.6}
.log .p{color:#f7e6e2} .log .e{color:#f4a6b3} .log .s{color:var(--lav)} .log .crit{color:var(--gold);font-weight:700} .log .sy{color:var(--mint)} .log .miss{color:var(--dim)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts small{font-size:10px;opacity:.75}
.result{padding:20px;border-radius:22px;text-align:center;background:var(--card-2)}
.result.won{background:rgba(148,216,188,.09)}
.result.lose{background:rgba(240,136,153,.09)}
.result h3{margin:0 0 6px;font:700 22px/1.2 var(--f-display)}
.result.won h3{color:var(--mint)} .result.lose h3{color:var(--rose)}
.result p{margin:4px 0;color:var(--muted)}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.loot span{padding:6px 12px;border-radius:999px;background:var(--card-3);font-size:12px;font-weight:600}

/* ---------- skills / journal ---------- */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.skill{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:16px;border-radius:22px;background:var(--card-2)}
.skill.locked{opacity:.45}
.slv{width:56px;height:56px;border-radius:16px;background:var(--card-3);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 10px/1 var(--f-display);color:var(--muted);gap:2px}
.slv b{font:700 20px/1 var(--f-display);color:var(--fg)}
.skill.on .slv{background:rgba(239,139,125,.18)}
.skill.on .slv b{color:var(--coral)}
.skill h4{margin:0 0 6px;font:600 15px/1.2 var(--f-display);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.skill p{margin:0;font-size:13px;color:var(--muted)}
.tg{display:inline-block;padding:3px 8px;border-radius:999px;font:600 10px/1.2 var(--f-display);background:var(--card-3);color:var(--muted)}
.tg.act{color:var(--coral-2);background:rgba(239,139,125,.15)}
.tg.pas{color:var(--lav);background:rgba(188,168,242,.15)}
.tg.mp{color:var(--sky);background:rgba(149,199,239,.15)}
.jgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.chart7{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:190px}
.c7{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.c7 .v{font:600 11px/1 var(--f-display);color:var(--muted)}
.c7 .b{width:min(36px,100%);border-radius:10px;background:var(--card-3);min-height:3px}
.c7 .b.met{background:linear-gradient(180deg,var(--coral-2),var(--coral))}
.c7 .d{font:600 11px/16px var(--f-display);color:var(--dim);height:16px}
.c7 .d.today{color:var(--coral)}
.tline{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(241,204,143,.55);pointer-events:none}
.tline span{position:absolute;left:0;top:-18px;font:600 11px/1 var(--f-display);color:var(--gold)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-template-columns:repeat(12,minmax(12px,1fr));gap:5px;max-width:560px;min-width:220px}
.hc{border-radius:4px;background:var(--card-3);aspect-ratio:1}
.hc.l1{background:rgba(239,139,125,.28)} .hc.l2{background:rgba(239,139,125,.5)} .hc.l3{background:rgba(239,139,125,.75)} .hc.l4{background:var(--coral)}
.hc.fut{visibility:hidden}
.heat-leg{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--muted)}
.heat-leg .hc{width:12px;height:12px}
.tt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin-bottom:12px}
.tt span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt b{font:600 12px/1.4 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.tt .bar{grid-column:1/-1;height:6px}
.achs{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--card-2)}
.ach.off{opacity:.42}
.ach h4{margin:0;font:600 13px/1.25 var(--f-display)}
.ach p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.lg{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.lg:last-child{border-bottom:0}
.lg time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- toasts, popover, modal ---------- */
#toasts{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:18px;z-index:70;display:flex;flex-direction:column;gap:10px;width:min(350px,calc(100vw - 32px));pointer-events:none}
.toast{--tc:var(--coral);pointer-events:auto;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(55,35,42,.97);border:1px solid var(--line-2);box-shadow:0 14px 30px rgba(10,2,6,.4);animation:tin .3s ease-out}
.toast.out{animation:tout .3s ease-in forwards}
.toast .ti{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 20%,transparent);color:var(--tc);font:700 14px/1 var(--f-display)}
.toast h5{margin:0;font:600 13px/1.2 var(--f-display);color:var(--tc)}
.toast p{margin:2px 0 0;font-size:13px;line-height:1.4}
.t-good{--tc:var(--mint)} .t-warn{--tc:var(--rose)} .t-gold{--tc:var(--gold)} .t-violet{--tc:var(--lav)} .t-info{--tc:var(--coral)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
.popover{position:fixed;z-index:65;width:min(350px,calc(100vw - 32px));max-height:min(440px,70vh);overflow-y:auto;background:var(--card);border:1px solid var(--line-2);border-radius:22px;padding:14px;box-shadow:0 20px 40px rgba(10,2,6,.45);animation:tin .2s ease-out}
.popover h4{margin:2px 4px 10px;font:600 15px/1 var(--f-display);display:flex;justify-content:space-between;align-items:center}
.ib{--tc:var(--coral);display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
.ib:last-child{border-bottom:0}
.ib i{width:8px;height:8px;border-radius:50%;background:var(--tc);margin-top:6px}
.ib b{font:600 13px/1.3 var(--f-display);color:var(--tc)}
.ib p{margin:1px 0 0;font-size:12px;color:var(--fg)}
.ib time{font-size:11px;color:var(--dim)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(18,9,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px 16px;overflow-y:auto}
.modal{width:min(680px,100%);background:var(--card);border:1px solid var(--line-2);border-radius:30px;padding:26px;animation:tin .3s ease-out}
.sys{display:flex;justify-content:center;margin-bottom:14px}
.sys span{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(239,139,125,.15);color:var(--coral-2);font:600 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.modal.red .sys span{background:rgba(240,136,153,.15);color:var(--rose)}
.modal h3{text-align:center;font:700 22px/1.25 var(--f-display);margin:0 0 8px}
.lead{text-align:center;color:var(--muted);margin:0 0 18px}
.base-rw{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.base-rw span{padding:6px 12px;border-radius:999px;background:var(--card-2);font:600 12px/1.2 var(--f-display)}
.rws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rw{--rc:#cdb8b4;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px 14px;border-radius:22px;border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);background:linear-gradient(170deg,color-mix(in srgb,var(--rc) 20%,var(--card-2)),var(--card-2) 70%);transition:transform .15s,box-shadow .2s;color:var(--fg)}
.rw:hover{transform:translateY(-3px);box-shadow:0 12px 24px color-mix(in srgb,var(--rc) 22%,transparent)}
.rw b{font:600 15px/1.25 var(--f-display)}
.rw-ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.2)}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.pen-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pen-list li{padding:10px 14px;border-radius:14px;background:rgba(240,136,153,.1);color:#f6bcc5;font-size:14px}
.lvup{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none}
.lvup div{text-align:center;animation:lvl 2.2s ease-out forwards}
.lvup b{display:block;font:700 clamp(46px,9vw,96px)/1 var(--f-display);letter-spacing:.06em;color:#fff4ef;text-shadow:0 0 22px rgba(239,139,125,.9),0 0 50px rgba(239,139,125,.6)}
.lvup span{display:block;margin-top:10px;font:600 16px/1 var(--f-display);letter-spacing:.3em;color:var(--coral-2)}
@keyframes lvl{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.04)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.06)}}

/* ---------- schedule ---------- */
.sched{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.rems{display:flex;flex-direction:column;gap:10px}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--card-2)}
.rem.off{opacity:.55}
.rem .tm{font:600 28px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--coral-2);min-width:84px}
.rem h4{margin:0 0 7px;font:600 15px/1.2 var(--f-display)}
.rem .sub{display:block;margin-top:6px}
.rem-act{display:flex;gap:6px;align-items:center}
.dchips{display:flex;gap:4px;flex-wrap:wrap}
.dchip{min-width:32px;padding:4px 7px;border-radius:999px;font:600 10px/1.2 var(--f-display);text-align:center;background:var(--card-3);color:var(--dim);border:0}
.dchip.on{background:rgba(239,139,125,.2);color:var(--coral-2)}
button.dchip{padding:9px 10px;font-size:12px;min-width:46px}
button.dchip:focus-visible,.switch:focus-visible{outline:2px solid var(--coral-2);outline-offset:2px}
.switch{position:relative;width:44px;height:26px;flex:none;border-radius:999px;border:0;background:var(--card-3);padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--coral)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff4ef}
.rem-form{display:grid;gap:14px}
.rem-form .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.quick-days{display:flex;gap:12px;margin-top:8px}
.perm{--c:var(--dim);display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card-2);font-size:13px;font-weight:600}
.perm i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.55}
.chip.next{background:rgba(188,168,242,.12);border-color:transparent;color:var(--lav);cursor:pointer}
.chip.next svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

}
@media (prefers-reduced-motion:reduce){

const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
function dayKey(d = new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function keyDate(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(key, n){ const d = keyDate(key); d.setDate(d.getDate()+n); return dayKey(d); }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`; }
function hashStr(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function itemById(id){ return ITEMS.find(i => i.id === id); }

const SPR = new Map();
function blank(w,h){ return Array.from({length:h}, () => Array(w).fill('.')); }
function rowsFrom(obj, w, h){
  const g = blank(w,h);
  for (const k in obj){ const r = obj[k]; for (let i = 0; i < w && i < r.length; i++) if (r[i] !== '.') g[+k][i] = r[i]; }
  return g.map(r => r.join(''));
}
function ptsRows(list, w, h){ const g = blank(w,h); list.forEach(([x,y]) => { if (g[y]) g[y][x] = 'q'; }); return g.map(r => r.join('')); }
function spriteURL(key, w, h, layers){
  if (SPR.has(key)) return SPR.get(key);
  let url = '';
  try {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    for (const L of layers){
      L.rows.forEach((row, y) => {
        for (let i = 0; i < row.length && i < w; i++){
          const ch = row[i]; if (ch === '.') continue;
          const col = L.pal[ch]; if (!col) continue;
          x.fillStyle = col; x.fillRect(i, y, 1, 1);
        }
      });
    }
    url = c.toDataURL();
  } catch(e){}
  SPR.set(key, url); return url;
}
function pxImg(url, w, h, s, cls, alt){ return `<img class="px ${cls||''}" src="${url}" width="${w*s}" height="${h*s}" alt="${esc(alt||'')}" draggable="false">`; }
function mix(a, b, t){
  const p = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const A = p(a), B = p(b);
  return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}

function heroWeapon(it){
  const g = blank(16,24);
  const put = (x,y,c) => { if (x>=0 && x<16 && y>=0 && y<24) g[y][x] = c; };
  if (it.spear){
    for (let y = 15; y >= 5; y--) put(13,y,'n');
    put(13,4,'w'); put(13,3,'W'); put(12,4,'w'); put(14,4,'w');
    return g.map(r => r.join(''));
  }
  const side = cx => {
    put(cx,14,'n'); put(cx,15,'n'); put(cx-1,13,'g'); put(cx,13,'g'); put(cx+1,13,'g');
    for (let i = 1; i <= it.len; i++){ put(cx,13-i, i === it.len ? 'W' : 'w'); if (it.wide && i < it.len) put(cx+1,13-i,'W'); }
  };
  side(13); if (it.twin) side(2);
  return g.map(r => r.join(''));
}
function bestRarity(){
  let best = null;
  for (const [slot] of SLOTS){ const it = itemById(S.equip[slot]); if (it && (!best || RARITY[it.rar].o > RARITY[best].o)) best = it.rar; }
  return best;
}
function auraColor(){ const r = bestRarity(); return r ? RARITY[r].c : '#ef8b7d'; }
function armorPal(it){
  if (!it) return DEFAULT_OUTFIT;
  const c = it.col, C = mix(c,'#000000',.32), x = it.col2;
  const p = {c, C, B:x, p:mix(c,'#1c1622',.62), P:mix(c,'#110c16',.74), b:'#4a3424',
    f:x, F:mix(x,'#000000',.3), A:mix(c,'#ffffff',.28), t:x, k:c, K:mix(c,'#000000',.35), v:x};
  if (it.style === 'robe'){ p.p = c; p.P = C; }
  return p;
}
function heroURL(sil){
  const e = S.equip, key = `hero|${SLOTS.map(s => e[s[0]]).join('|')}|${sil?1:0}`;
  if (SPR.has(key)) return SPR.get(key);
  const arm = itemById(e.armor), boots = itemById(e.boots), head = itemById(e.head), w = itemById(e.weapon);
  const ring = itemById(e.ring), amu = itemById(e.amulet);
  const pal = Object.assign({}, HERO_PAL, armorPal(arm));
  if (boots) pal.b = boots.col;
  const L = [];
  if (arm && arm.style === 'cloak') L.push({rows:CLOAK_UNDER, pal});
  L.push({rows:HERO_BASE, pal});
  if (arm && ARMOR_OVER[arm.style]) L.push({rows:ARMOR_OVER[arm.style], pal});
  if (boots) L.push({rows:BOOT_OVER, pal:{z:mix(boots.col,'#ffffff',.35)}});
  if (head){
    L.push({rows:HEAD_OVER[head.shape], pal:{o:'#160c12', u:head.col, U:head.col2}});
    if (head.glow) L.push({rows:ptsRows([[6,5],[9,5]],16,24), pal:{q:head.glow}});
  }
  if (w) L.push({rows:heroWeapon(w), pal:{w:w.col, W:w.col2, g:w.g, n:w.spear ? w.g : '#3a2a20'}});
  if (ring) L.push({rows:ptsRows([[3,14]],16,24), pal:{q:ring.col2}});
  if (amu) L.push({rows:ptsRows([[7,10],[8,10]],16,24), pal:{q:amu.col2}});
  return spriteURL(key,16,24,L);
}
function heroImg(s, cls){

}

function weaponIconRows(it){
  const g = blank(12,12);
  const P = (x,y,c,mir) => { const X = mir ? 11-x : x; if (X>=0 && X<12 && y>=0 && y<12) g[y][X] = c; };
  if (it.spear){
    for (let i = 0; i < 8; i++) P(1+i, 10-i, 'n');
    P(9,2,'w'); P(10,1,'W'); P(9,1,'w'); P(10,2,'w');
    return g.map(r => r.join(''));
  }
  const len = clamp(Math.round(it.len*0.75)+1, 4, 8);
  const one = mir => {
    for (let i = 0; i < len; i++){ const x = 4+i, y = 7-i; P(x,y, i === len-1 ? 'W' : 'w', mir); if (i < len-1) P(x+1,y,'W',mir); }
    P(2,7,'g',mir); P(3,8,'g',mir); P(4,9,'g',mir); P(2,9,'n',mir); P(1,10,'n',mir); P(0,11,'m',mir);
  };
  one(false); if (it.twin) one(true);
  return g.map(r => r.join(''));
}
function iconURL(id){
  const key = 'ic|' + id; if (SPR.has(key)) return SPR.get(key);
  const it = itemById(id);
  let rows, pal;
  if (it){
    const dk = mix(it.col,'#000000',.3);
    switch (it.slot){
      case 'weapon': rows = weaponIconRows(it); pal = {w:it.col, W:it.col2, g:it.g, n:'#7a5432', m:it.g}; break;
      case 'head':   rows = ICON[it.shape]; pal = {o:'#1a0c12', u:it.col, U:it.shape === 'band' ? it.col2 : (it.shape === 'helm' ? it.col2 : dk), G:it.col2, d:'#1a0c12', g:it.glow || '#3a2a30'}; break;
      case 'armor':  if (it.style === 'cloak'){ rows = ICON.cloak; pal = {h:it.col, H:mix(it.col,'#ffffff',.2), v:it.col2}; }
                     else { rows = ICON.torso; pal = {c:it.col, C:dk, f:it.style === 'fur' ? it.col2 : dk, t:it.col2, B:it.col2}; } break;
      case 'boots':  rows = ICON.boots; pal = {o:'#1a0c12', u:it.col, U:dk}; break;
      case 'ring':   rows = ICON.ring; pal = {o:it.col, g:it.col2, G:mix(it.col2,'#ffffff',.5)}; break;
      case 'amulet': rows = ICON.neck; pal = {o:it.col, g:it.col2, G:mix(it.col2,'#ffffff',.5)}; break;
    }
  }
  else if (POTION[id]){ rows = ICON.potion; pal = Object.assign({o:'#f2e2dc', W:'#ffffff', k:'#8a5a30', m:'#b07a40'}, POTION[id]); }
  else if (id === 'key'){ rows = ICON.key; pal = {o:'#3a6aa8', y:'#95c7ef'}; }
  else if (id === 'gold'){ rows = ICON.bag; pal = {o:'#6b4a1a', y:'#d9a441', Y:'#f5d27a', d:'#7a5414'}; }
  else if (id === 'stat' || id === 'crystal'){ rows = ICON.crystal; pal = {v:'#9a74f0', V:'#e6dcff'}; }

/* --- city map (240x140) --- */
const MAP_W = 240, MAP_H = 140;
const DISTRICTS = [
  {n:'Harbor',x:14,y:6},{n:'Downtown',x:50,y:6},{n:'City Park',x:84,y:6},
  {n:'Industrial Zone',x:17,y:95},{n:'Old Market',x:50,y:95},{n:'Campus',x:84,y:95}

function riverY(x){ return 86 + Math.sin(x/27)*11 + Math.sin(x/9)*2; }
let MAP_URL = '';
function mapURL(){
  if (MAP_URL) return MAP_URL;
  try {
    const cv = document.createElement('canvas'); cv.width = MAP_W; cv.height = MAP_H;
    const c = cv.getContext('2d'), R = seeded(20261008);
    const px = (x,y,col) => { c.fillStyle = col; c.fillRect(x,y,1,1); };
    const rect = (x,y,w,h,col) => { c.fillStyle = col; c.fillRect(x,y,w,h); };
    rect(0,0,MAP_W,MAP_H,'#24161b');
    const VX = [0,38,78,118,158,198,240], HY = [0,34,62,112,140];
    for (let i = 0; i < VX.length-1; i++) for (let j = 0; j < HY.length-1; j++){
      const x0 = VX[i]+3, x1 = VX[i+1]-2, y0 = HY[j]+3, y1 = HY[j+1]-2;
      if (i >= 4 && j <= 1){
        rect(x0,y0,x1-x0,y1-y0,'#26302a');
        const n = Math.floor((x1-x0)*(y1-y0)/16);
        for (let k = 0; k < n; k++){ const tx = x0+1+Math.floor(R()*(x1-x0-3)), ty = y0+1+Math.floor(R()*(y1-y0-3)); rect(tx,ty,2,2,'#3d5a46'); px(tx,ty,'#5e8466'); }
        continue;
      }
      const ind = i <= 1 && j >= 2;
      let y = y0;
      while (y < y1-2){
        const bh = Math.min(y1-y, 5+Math.floor(R()*7));
        let x = x0;
        while (x < x1-2){
          const bw = Math.min(x1-x, 5+Math.floor(R()*9));
          const base = ind ? ['#2f282c','#362e33','#2a2428'][Math.floor(R()*3)] : ['#3a2229','#43272f','#351f26','#4a2c34'][Math.floor(R()*4)];
          rect(x,y,bw-1,bh-1,base); rect(x,y,bw-1,1, ind ? '#4a4246' : '#5a3640'); rect(x,y+bh-2,bw-1,1,'#2a171c');
          for (let wy = y+2; wy < y+bh-2; wy += 2) for (let wx = x+1; wx < x+bw-2; wx += 2){
            const r = R();
            if (r < 0.12) px(wx,wy, R() < 0.7 ? '#e8c084' : '#fff0c8'); else if (r < 0.16) px(wx,wy,'#ef8b7d');
          }
          x += bw;
        }
        y += bh;
      }
    }
    for (const x of VX.slice(1,-1)){ rect(x-1,0,3,MAP_H,'#2b1a20'); for (let y = 0; y < MAP_H; y += 4) px(x,y,'#5a3a42'); }
    for (const y of HY.slice(1,-1)){ rect(0,y-1,MAP_W,3,'#2b1a20'); for (let x = 0; x < MAP_W; x += 4) px(x,y,'#5a3a42'); }
    for (let x = 0; x < MAP_W; x++){
      const yc = Math.round(riverY(x));
      for (let y = yc-7; y <= yc+7; y++){ if (y < 0 || y >= MAP_H) continue; px(x,y, Math.abs(y-yc) >= 6 ? '#3a3460' : '#2a2444'); }
      if (R() < 0.25) px(x, yc-3+Math.floor(R()*7), '#6a64a0');
    }
    for (const x of VX.slice(1,-1)){ const yc = Math.round(riverY(x)); rect(x-2,yc-8,5,17,'#3a252c'); rect(x-2,yc-8,1,17,'#6a4a52'); rect(x+2,yc-8,1,17,'#6a4a52'); }
    MAP_URL = cv.toDataURL();
  } catch(e){}
  return MAP_URL;
}

/* =========================================================

function has(id){ const s = SKILLS.find(x => x.id === id); return !!s && S.level >= s.lv; }
function bonus(){
  const b = {atk:0,def:0,hp:0,str:0,agi:0,vit:0,int:0,per:0};
  for (const [slot] of SLOTS){ const it = itemById(S.equip[slot]); if (it) for (const k in it.b) b[k] += it.b[k]; }
  return b;
}
function derived(){
  const b = bonus(), st = {};
  for (const s of STATS) st[s.k] = S.stats[s.k] + (b[s.k]||0);
  return Object.assign(st, {
    maxHp: 50 + st.vit*10 + b.hp, maxMp: 30 + st.int*3,
    atk: Math.round(st.str*1.5 + b.atk), def: Math.round(st.vit*0.5 + b.def),
    crit: Math.min(50, st.agi*0.4), dodge: Math.min(35, st.agi*0.25),
    xpBonus: (st.int-10) + (has('focus') ? 10 : 0), goldBonus: (st.per-10) + (has('will') ? 10 : 0), bonus: b

}
function clampVitals(){ const d = derived(); S.hp = clamp(Math.round(S.hp),0,d.maxHp); S.mp = clamp(Math.round(S.mp),0,d.maxMp); }
function rankOf(lv){ let r = RANKS[0]; for (const x of RANKS) if (lv >= x.lv) r = x; return r; }

function okFocus(key){ return S.sessions.filter(s => s.d === key && s.ok && s.mode !== 'break'); }

  const t = dayKey(), target = S.settings.target;

  while (countDay(d) >= target && n < 3650){ n++; d = addDays(d,-1); }
  return n;
}

  const d = derived(), min = S.settings.focus, on = S.timer.punctual ? 1.2 : 1;
  return {
    xp: Math.round(min*2*(1+d.xpBonus/100)*(1+(S.buffs.xpNext||0)/100)*on),
    gold: Math.round(min*0.8*(1+d.goldBonus/100)*(1+(S.buffs.goldNext||0)/100)*on)

}
function ensureDay(){ const k = dayKey(); if (!S.day || S.day.key !== k) S.day = {key:k, gates:0, skills:0, longBreaks:0}; }

/* =========================================================
   XP, LEVELS, ACHIEVEMENTS
   ========================================================= */
function gainXp(n){
  S.xp += n;
  let ups = 0;
  const oldRank = rankOf(S.level).r;
  while (S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level); S.level++; S.statPts += 3; ups++;
    const sk = SKILLS.find(s => s.lv === S.level);
    if (sk) setTimeout(() => toast('violet','New skill',`You learned "${sk.name}" (${sk.type}).`), 900);
  }
  if (ups){
    const d = derived(); S.hp = d.maxHp; S.mp = d.maxMp;
    levelFlash(S.level); chime('lvl');
    toast('good','Level up',`Level ${S.level}. +${ups*3} stat points. HP and MP fully restored.`);
    const nr = rankOf(S.level).r;
    if (nr !== oldRank) setTimeout(() => toast('gold','Re-evaluation',`Your rank is now ${nr}.`), 1300);
  }
}
function checkAch(){
  for (const a of ACH){
    if (S.ach.includes(a.id)) continue;
    let ok = false; try { ok = a.test(); } catch(e){}

const MODE_NAME = {focus:'Focus', short:'Short break', long:'Long break'};
function full(mode){ return S.settings[mode]*60; }
function remainingNow(){ const T = S.timer; return T.running ? Math.max(0, Math.ceil((T.endAt - Date.now())/1000)) : T.remaining; }
function inProgress(){ const T = S.timer; return T.running || T.remaining < full(T.mode); }
function resetTimer(mode){ const T = S.timer; T.mode = mode; T.running = false; T.endAt = null; T.remaining = full(mode); T.startedAt = null; T.punctual = false; }
function startRunning(){ const T = S.timer; T.endAt = Date.now() + T.remaining*1000; T.running = true; if (!T.startedAt) T.startedAt = Date.now(); }

function toggleTimer(){
  const T = S.timer;
  if (S.pending){ openRewards(); return; }
  unlockAudio();
  if (T.running){ T.remaining = remainingNow(); T.running = false; T.endAt = null; }
  else {
    const fresh = !T.startedAt;
    startRunning();
    if (fresh && T.mode === 'focus'){
      if (S.punctual && Date.now() <= S.punctual.until){ T.punctual = true; S.punctual = null; toast('gold','On time','You started on schedule. +20% XP and gold for this session.'); }
      else toast('info','Quest started', T.label ? `Focus: ${T.label}` : 'Focus session started. Do not run from the gate.');
    }
  }
  save(); renderTimer(); renderRails();
}
function abandonTimer(){
  const T = S.timer;
  if (!inProgress()) return;
  if (T.mode !== 'focus'){ resetTimer('focus'); save(); render(); toast('info','System','Break skipped. Ready for the next focus session.'); return; }
  const elapsed = full('focus') - remainingNow();
  if (elapsed < 60){ resetTimer('focus'); save(); render(); toast('info','System','Cancelled within the first minute. No penalty.'); return; }
  const d = derived();
  confirmBox({
    title:'Run from the gate?',
    body:`Abandoning a focus session costs <b>${Math.round(d.maxHp*0.1)} HP</b> and <b>${Math.min(S.gold,10)} gold</b>, and it is logged as failed.`,
    yes:'Abandon session', no:'Keep focusing', danger:true, onYes: applyAbandon
  });
}
function applyAbandon(){
  const d = derived(), T = S.timer;
  const elapsedMin = Math.max(1, Math.round((full('focus') - remainingNow())/60));
  const hpLoss = Math.round(d.maxHp*0.1); S.hp = Math.max(1, S.hp - hpLoss);
  const gl = Math.min(S.gold, 10); S.gold -= gl;
  S.sessions.push({d:dayKey(), t:Date.now(), label:T.label || 'Untitled', min:elapsedMin, ok:false, mode:'focus'});
  resetTimer('focus'); save(); render();
  toast('warn','Penalty',`Session abandoned. -${hpLoss} HP, -${gl} gold.`);
}
function setMode(m){
  if (S.timer.mode === m) return;
  if (inProgress() && S.timer.mode === 'focus'){ toast('warn','System','Finish or abandon the focus session first.'); return; }
  resetTimer(m); save(); render();
}
function completeTimer(){
  const T = S.timer, mode = T.mode;
  T.running = false; T.endAt = null;
  if (mode === 'focus'){
    finishFocus();
    T.cycle++;
    resetTimer(T.cycle % 4 === 0 ? 'long' : 'short');
    if (S.settings.autoBreak) startRunning();
  } else {

  }

}
function finishFocus(){

function rollRewards(){
  const pool = Object.keys(REWARDS), picks = [];
  while (picks.length < 3){
    const avail = pool.filter(k => !picks.includes(k));
    const tot = avail.reduce((a,k) => a + REWARDS[k].w, 0);
    let r = Math.random()*tot;
    for (const k of avail){ r -= REWARDS[k].w; if (r <= 0){ picks.push(k); break; } }
  }
  return picks.map(id => Object.assign({id}, REWARDS[id].gen()));
}
function randomGear(maxPrice, extraLv){
  const cand = ITEMS.filter(i => !S.owned.includes(i.id) && i.lv <= S.level + extraLv && i.price <= maxPrice);

}

function applyReward(r){

    case 'elixir': S.potions.elixir += r.v; toast('info','Reward','+1 Grand Elixir'); break;
    case 'key': S.keys += r.v; toast('info','Reward','+1 gate key'); break;

      const it = randomGear(1000, 5);

    }

}

function questsFor(k){
  const R = seeded(hashStr(k)), pool = SIDE_Q.slice(), picks = [];
  while (picks.length < 2){ const i = Math.floor(R()*pool.length); picks.push(pool.splice(i,1)[0]); }
  return [MAIN_Q, ...picks];
}
function questState(q, k){
  const n = q.n(), p = Math.min(n, q.prog(k));
  const claimed = q.main ? !!S.dailyClaimed[k] : (S.questsClaimed[k] || []).includes(q.id);
  return {n, p, done: p >= n, claimed};
}
function rwText(rw){
  const out = [];
  if (rw.stat) out.push(`+${rw.stat} stat pts`);
  if (rw.gold) out.push(`+${rw.gold} gold`);

  if (rw.hp) out.push(`+${rw.hp} health potion`);
  if (rw.mp) out.push(`+${rw.mp} mana potion`);

function claimableCount(){ const k = dayKey(); return questsFor(k).filter(q => { const s = questState(q,k); return s.done && !s.claimed; }).length; }
function claimQuest(id){
  const k = dayKey(), q = questsFor(k).find(x => x.id === id); if (!q) return;

  else (S.questsClaimed[k] = S.questsClaimed[k] || []).push(q.id);

}
function dailyCheck(){
  const today = dayKey();
  ensureDay();
  if (S.lastSeen === today) return;
  let d = S.lastSeen, n = 0, missed = 0;
  while (d < today && n < 14){
    if (d > S.created && countDay(d) < S.settings.target) missed++;
    d = addDays(d,1); n++;
  }
  S.lastSeen = today;
  if (missed > 0){
    if (S.shield > 0){ S.shield--; S.penalty = {missed, loss:0, shielded:true}; }
    else {
      const loss = Math.round(S.gold*Math.min(0.3, 0.1*missed));

}
function showPenalty(){

function usePotion(kind){

  else { if (S.hp >= d.maxHp && S.mp >= d.maxMp){ toast('info','System','HP and MP are already full.'); return false; } S.hp = d.maxHp; S.mp = d.maxMp; }

function maxTier(){ let t = 0; GATES.forEach((g,i) => { if (S.level >= g.lv) t = i; }); return t; }
function spawnGate(){
  if (S.gates.length >= 6) return null;
  const m = maxTier();
  const hasLocked = S.gates.some(g => S.level < GATES[g.t].lv);
  let t;
  if (!hasLocked && m < 5 && Math.random() < 0.18) t = m+1;
  else t = (m === 0 || Math.random() < 0.6) ? m : randInt(0, m-1);
  let x = 50, y = 30, ok = false;
  for (let k = 0; k < 80 && !ok; k++){
    x = rand(7,93); y = rand(16,84);
    const mx = x/100*MAP_W, my = y/100*MAP_H;
    if (Math.abs(my - riverY(mx)) < 11) continue;
    ok = S.gates.every(g => Math.hypot((g.x-x)*1.7, g.y-y) > 16);
  }
  const red = t <= m && Math.random() < 0.08;
  const g = {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), t, x:+x.toFixed(1), y:+y.toFixed(1), red};
  S.gates.push(g);
  return g;
}
function districtOf(g){ const c = g.x < 33.3 ? 0 : g.x < 66.6 ? 1 : 2, r = g.y < 50 ? 0 : 1; return DISTRICTS[r*3+c].n; }
function enterGate(id){
  const gate = S.gates.find(g => g.id === id); if (!gate) return;

  };

  if (gate.red) blog('e', 'The exit has sealed. There is no escape from this gate.');
  blog(boss ? 'e' : 'miss', boss ? `A crushing presence... the boss ${name} appears!` : `A ${name} crawls out of the dark.`);

}
function blog(c, t){ const B = S.battle; if (!B) return; B.log.push({c,t}); if (B.log.length > 60) B.log.shift(); }
function pHit(mult, verb, pierce){
  const B = S.battle, d = derived();
  const base = d.atk*(B.weak?0.8:1)*mult*rand(0.85,1.15);
  let dmg = Math.max(1, Math.round(base - (pierce ? 0 : B.def*0.6)));
  const crit = Math.random()*100 < d.crit;
  if (crit) dmg = Math.round(dmg*1.8);
  B.hp = Math.max(0, B.hp - dmg);

  FX.foe = true;
}
function act(kind){
  const B = S.battle; if (!B || B.over) return;
  const d = derived();
  if (kind === 'attack') pHit(1, 'You slash.');
  else if (kind === 'potion-hp'){ if (!usePotion('hp')) return; blog('sy','You drink a health potion.'); }
  else if (kind === 'potion-mp'){ if (!usePotion('mp')) return; blog('sy','You drink a mana potion.'); }
  else if (kind === 'potion-elixir'){ if (!usePotion('elixir')) return; blog('sy','You drink a Grand Elixir. Fully restored.'); }
  else if (kind === 'flee'){
    if (B.red){ toast('warn','System','The red gate is sealed. There is no way out.'); return; }
    if (Math.random() < 0.75){ blog('miss','You escaped the gate. The key is spent.'); B.over = 'flee'; B.result = {}; save(); render(); return; }
    blog('e','Escape failed! The monster blocks your path.');
  } else {
    const sk = SKILLS.find(s => s.id === kind);
    if (!sk || !has(kind) || sk.type !== 'active') return;
    if (S.mp < sk.mp){ toast('warn','System','Not enough MP.'); return; }
    S.mp -= sk.mp; ensureDay(); S.day.skills++;
    blog('s', `[Skill] ${sk.name}!`);
    if (kind === 'double'){ pHit(0.75,'First stab.'); if (B.hp > 0) pHit(0.75,'Second stab.'); }
    if (kind === 'dash'){ pHit(0.6,'You blink forward and strike.'); B.evade = true; }
    if (kind === 'blood'){ B.fear = 3; blog('s', `${B.name} trembles in fear.`); pHit(0.5,'You strike.'); }
    if (kind === 'mutil'){ pHit(2.2,'A storm of blades!'); }
    if (kind === 'ruler'){ pHit(1.6,'An unseen force crushes the enemy.', true); }
  }
  if (B.hp <= 0) return win();
  if (S.shadows.length){
    const pow = S.shadows.reduce((a,s) => a + s.power, 0) * (has('monarch') ? 2 : 1);
    const dmg = Math.max(1, Math.round(pow*rand(0.85,1.15) - B.def*0.3));
    B.hp = Math.max(0, B.hp - dmg); FX.foe = true;
    blog('s', `Your shadow army charges: ${dmg} damage.`);
    if (B.hp <= 0) return win();
  }

  if (S.hp <= 0) return lose();
  save(); render();
}
function enemyTurn(d){
  const B = S.battle;
  if (B.evade){ B.evade = false; blog('miss', `${B.name} attacks, but you are already gone.`); return; }
  if (Math.random()*100 < d.dodge){ blog('miss', `You dodge ${B.name}'s attack.`); return; }
  const heavy = B.boss && Math.random() < 0.18;
  const atk = B.atk*(B.fear>0?0.7:1)*rand(0.85,1.15)*(heavy?1.6:1);
  if (B.fear > 0) B.fear--;
  const dmg = Math.max(1, Math.round(atk - d.def));
  S.hp = Math.max(0, S.hp - dmg); FX.me = true;
  blog('e', `${B.name} ${heavy ? 'unleashes a devastating blow' : 'attacks'}: -${dmg} HP.`);
  if (S.hp <= 0 && has('will') && !B.survived){ S.hp = 1; B.survived = true; blog('s','[Iron Will] You refuse to fall. 1 HP left.'); }
}
function win(){
  const B = S.battle, d = derived(), t = B.t;
  const mul = (B.boss?2.5:1)*(B.red?2:1);
  const xp = Math.round((30 + t*35)*mul);
  const gold = Math.round((15 + t*25)*mul*(1+d.goldBonus/100));
  const dropM = 1 + (d.per-10)/100;
  const loot = [`+${xp} XP`, `+${gold} gold`];
  S.gold += gold;
  if (Math.random() < 0.3*dropM){ S.potions.hp++; loot.push('Health Potion'); }
  if (Math.random() < 0.15*dropM){ S.potions.mp++; loot.push('Mana Potion'); }
  if (Math.random() < (B.boss?0.2:0.04)*dropM){ S.potions.elixir++; loot.push('Grand Elixir'); }
  if (Math.random() < (B.boss?0.4:0.08)*dropM){ S.keys++; loot.push('Gate Key'); }
  if (B.boss && Math.random() < (B.red?0.6:0.25)*dropM){ const it = randomGear(B.red ? 99999 : 3000, 5); if (it){ gainItem(it); loot.push(it.name); } }
  S.totals.kills++; if (B.boss) S.totals.bosses++; if (B.red) S.totals.reds++;
  ensureDay(); S.day.gates++;
  blog('sy', `[System] ${B.name} defeated.`);
  if (has('extract') && Math.random() < (B.boss?0.6:0.3)){
    const sh = {name:'Shadow ' + B.name, mon:B.name, power: Math.max(2, Math.round(B.atk*0.4))};
    let added = false;
    if (S.shadows.length < 10){ S.shadows.push(sh); added = true; }
    else { const wi = S.shadows.reduce((m,s,i,a) => s.power < a[m].power ? i : m, 0); if (S.shadows[wi].power < sh.power){ S.shadows[wi] = sh; added = true; } }

  }

}
function lose(){
  const B = S.battle, d = derived();

const GATE_EVERY = 4*3600*1000;
function fmtDur(ms){ ms = Math.max(0, ms); const h = Math.floor(ms/3600000), m = Math.ceil((ms%3600000)/60000); return h ? `${h}h ${m}m` : `${m} min`; }
function ambientGates(){

}

const DAY_ORDER = [1,2,3,4,5,6,0];

function remDate(r, base){ const [h,m] = r.time.split(':').map(Number); const d = new Date(base); d.setHours(h, m, 0, 0); return d; }
function daysText(days){
  const s = days.slice().sort().join(',');

function nextReminders(limit){
  const now = new Date(), out = [];

    if (!r.on || !r.days.length) continue;
    for (let i = 0; i < 8; i++){
      const day = new Date(now); day.setDate(now.getDate()+i);
      if (!r.days.includes(day.getDay())) continue;
      const at = remDate(r, day);
      if (at <= now) continue;
      const k = dayKey(at), hm = r.time;
      const when = i === 0 ? `Today ${hm}` : i === 1 ? `Tomorrow ${hm}` : `${DAYS[at.getDay()]} ${hm}`;
      out.push({r, at, when, k});
      if (out.filter(o => o.r === r).length >= 3) break;
    }
  }
  return out.sort((a,b) => a.at - b.at).slice(0, limit);
}
function checkReminders(){

function icsExport(){
  const on = S.reminders.filter(r => r.on && r.days.length);
  if (!on.length){ toast('warn','Calendar','Turn on at least one reminder first.'); return; }
  const BY = ['SU','MO','TU','WE','TH','FR','SA'], pad = n => String(n).padStart(2,'0');
  const stamp = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const local = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hunter System//Study Reminders//EN','CALSCALE:GREGORIAN'];
  for (const r of on){
    const now = new Date(); let first = null;
    for (let i = 0; i < 8 && !first; i++){ const d = new Date(now); d.setDate(now.getDate()+i); if (r.days.includes(d.getDay())) first = remDate(r, d); }
    lines.push('BEGIN:VEVENT', `UID:${r.id}@hunter-system`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${local(first)}`,
      `DURATION:PT${S.settings.focus}M`, `RRULE:FREQ=WEEKLY;BYDAY=${r.days.map(d => BY[d]).join(',')}`,
      `SUMMARY:${r.label.replace(/[,;\\]/g,' ')} (Hunter System)`, 'DESCRIPTION:Open Hunter System and start a focus session.',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${r.label.replace(/[,;\\]/g,' ')}`,`TRIGGER:-PT${r.lead||0}M`,'END:VALARM','END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  try {
    const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hunter-study-schedule.ics';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('good','Calendar','Calendar file downloaded. Open it to add the reminders to your calendar.');
  } catch(e){ toast('warn','Calendar','Download failed in this browser.'); }
}

function vJournal(){
  const t = dayKey(), target = S.settings.target;
  const counts = {}; S.sessions.forEach(s => { if (s.ok && s.mode !== 'break') counts[s.d] = (counts[s.d] || 0) + 1; });
  const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(t,-i));
  const cv = days.map(k => counts[k] || 0), maxV = Math.max(target, ...cv, 1), H = 130;
  const chart = days.map((k,i) => `<div class="c7"><span class="v">${cv[i]}</span><div class="b ${cv[i] >= target ? 'met' : ''}" style="height:${Math.round(cv[i]/maxV*H)}px"></div><span class="d ${k === t ? 'today' : ''}">${k === t ? 'Today' : DAYS[keyDate(k).getDay()]}</span></div>`).join('');
  const lineB = 22 + Math.round(target/maxV*H);
  // heatmap: 12 weeks, Monday-first columns
  const td = keyDate(t), dow = (td.getDay()+6)%7;
  const start = addDays(t, -(dow + 7*11));
  let cells = '';
  for (let i = 0; i < 84; i++){
    const k = addDays(start, i), n = counts[k] || 0, fut = k > t;
    const lvl = n === 0 ? 0 : n >= target ? 4 : n >= target*0.66 ? 3 : n >= target*0.33 ? 2 : 1;
    cells += `<span class="hc ${lvl ? 'l'+lvl : ''} ${fut ? 'fut' : ''}" title="${k}: ${n} session${n === 1 ? '' : 's'}"></span>`;
  }
  const since = addDays(t,-29), byLabel = {};
  S.sessions.forEach(s => { if (s.ok && s.d >= since){ const l = labelOf(s); byLabel[l] = (byLabel[l] || 0) + s.min; } });
  const top = Object.entries(byLabel).sort((a,b) => b[1]-a[1]).slice(0,6), topMax = top.length ? top[0][1] : 1;
  const topHtml = top.length ? top.map(([l,m]) => `<div class="tt"><span title="${esc(l)}">${esc(l)}</span><b>${m >= 60 ? (m/60).toFixed(1)+'h' : m+' min'}</b><div class="bar xp"><i style="width:${m/topMax*100}%"></i></div></div>`).join('') : `<div class="empty">Name your sessions to see where your time goes.</div>`;
  const logs = S.sessions.slice(-25).reverse();
  const logHtml = logs.length ? logs.map(s => `<div class="lg"><time>${relTime(s.t).replace('Today, ','')}</time><span title="${esc(labelOf(s))}">${esc(labelOf(s))} · ${s.min} min</span><span class="st ${s.ok ? 'ok' : 'fail'}">${s.ok ? 'Done' : 'Failed'}</span></div>`).join('') : `<div class="empty">No sessions logged yet.</div>`;
  const achs = ACH.map(a => {
    const on = S.ach.includes(a.id);
    return `<div class="ach ${on ? 'on' : 'off'}"><span>${iconImg(on ? 'buff' : 'crystal',2)}</span><div style="min-width:0"><h4>${esc(a.name)}</h4><p>${esc(a.desc)}</p></div>
      ${on ? (S.title === a.title ? '<span class="pill-ok">Title</span>' : `<button class="btn ghost xs" data-act="title" data-arg="${a.id}">Use title</button>`) : ''}</div>`;
  }).join('');
  const red = S.redeemed.length ? S.redeemed.slice(0,10).map(r => `<div class="lg"><time>${relTime(r.t).replace('Today, ','')}</time><span>${esc(r.name)}</span><span class="price">${fmt(r.cost)}</span></div>`).join('') : `<div class="empty">Nothing redeemed yet. Real rewards live in the Shop.</div>`;
  return `<div class="jgrid">
    <div class="colstack">
      <section class="card"><div class="card-h"><h3>Overview</h3></div>
        <div class="tiles">
          <div class="tile"><small>Sessions today</small><b>${counts[t] || 0}</b></div>
          <div class="tile"><small>Minutes today</small><b>${minutesDay(t)}</b></div>
          <div class="tile"><small>Streak</small><b style="color:var(--gold)">${streak()} d</b></div>
          <div class="tile"><small>Total sessions</small><b>${fmt(S.totals.pomos)}</b></div>
          <div class="tile"><small>Total focus</small><b>${(S.totals.minutes/60).toFixed(1)}h</b></div>
          <div class="tile"><small>Gates cleared</small><b>${fmt(S.totals.kills)}</b></div>
        </div></section>
      <section class="card"><div class="card-h"><h3>Last 7 days</h3><span class="sub">Sessions per day</span></div>
        <div class="chart7">${chart}<div class="tline" style="bottom:${lineB}px"><span>Target ${target}</span></div></div></section>
      <section class="card"><div class="card-h"><h3>12-week activity</h3><span class="sub">Darker means closer to your target</span></div>
        <div class="heat-wrap"><div class="heat">${cells}</div></div>
        <div class="heat-leg">Less <span class="hc"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span> Target met</div></section>
      <section class="card"><div class="card-h"><h3>Session log</h3><span class="sub">Last 25</span></div>${logHtml}</section>
    </div>
    <div class="colstack">
      <section class="card"><div class="card-h"><h3>Top targets</h3><span class="sub">Last 30 days</span></div>${topHtml}</section>
      <section class="card"><div class="card-h"><h3>Achievements</h3><span class="sub">${S.ach.length} / ${ACH.length}</span></div><div class="achs">${achs}</div></section>
      <section class="card"><div class="card-h"><h3>Redeemed rewards</h3></div>${red}</section>
    </div>
  </div>`;
}
function vSettings(){
  const st = S.settings;
  return `<section class="card" data-settings><div class="card-h"><h3>Settings</h3></div>
    <div class="sec-t">Player</div>
    <label class="field" for="setName" style="max-width:360px"><span>Hunter name</span><input class="input" id="setName" maxlength="24" value="${esc(S.name)}"></label>
    <div class="sec-t">Timer (minutes)</div>
    <div class="form-grid">

      <label class="field" for="setLong"><span>Long break</span><input class="input" id="setLong" type="number" min="5" max="60" value="${st.long}"></label>
      <label class="field" for="setTarget"><span>Daily target (sessions)</span><input class="input" id="setTarget" type="number" min="1" max="16" value="${st.target}"></label>
    </div>
