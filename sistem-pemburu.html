    <div class="sec-t">Backup</div>
    <p class="muted" style="font-size:13px;margin:0 0 12px;max-width:70ch">Progress is stored in this browser. Export now and then so your level and gear survive a browser cleanup.</p>
    <div class="row-btns">
      <button class="btn sm" data-act="export">Export data (.json)</button>
      <button class="btn sm" data-act="import">Import data</button>
      <button class="btn sm danger" data-act="reset">Start over</button>
    </div>
  </section>`;
}

/* =========================================================
   RENDER
   ========================================================= */
function renderView(force){
  if (view === 'settings' && !force && document.querySelector('#view [data-settings]')) return;
  const f = {home:vHome, gates:vGates, char:vChar, shop:vShop, skills:vSkills, journal:vJournal, schedule:vSchedule, settings:vSettings}[view] || vHome;
  $('#view').innerHTML = f();
  FX.foe = false; FX.me = false;
  const lg = document.querySelector('.log'); if (lg) lg.scrollTop = lg.scrollHeight;
}
function render(force){ renderRails(); renderTop(); renderView(force); renderTimer(); }

/* =========================================================
   TOASTS, POPOVER, MODAL, FX
   ========================================================= */
const TOAST_ICON = {info:'!', good:'✓', warn:'!', gold:'★', violet:'✦'};
function toast(type, head, msg){
  type = type || 'info';
  const el = document.createElement('div');
  el.className = 'toast t-' + type;
  el.innerHTML = `<span class="ti">${TOAST_ICON[type] || '!'}</span><div><h5>${esc(head)}</h5><p>${esc(msg)}</p></div>`;
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 4200);
  if (S){
    S.inbox = S.inbox || []; S.inbox.unshift({t:Date.now(), type, head, msg});
    if (S.inbox.length > 40) S.inbox.length = 40;
    if (!$('#pop .popover')) S.unread = Math.min(99, (S.unread || 0) + 1);
    renderBell(); queueSave();
  }
}
function openPop(){
  const b = $('#bellBtn'); if (!b) return;
  const r = b.getBoundingClientRect();
  const list = (S.inbox || []).length ? S.inbox.map(n => `<div class="ib t-${n.type}"><i></i><div><b>${esc(n.head)}</b><p>${esc(n.msg)}</p><time>${relTime(n.t)}</time></div></div>`).join('') : `<div class="empty">No notifications yet.</div>`;
  const w = Math.min(350, window.innerWidth - 32);
  const left = clamp(r.right - w, 16, window.innerWidth - w - 16);
  $('#pop').innerHTML = `<div class="popover" style="top:${r.bottom + 10}px;left:${left}px" role="dialog" aria-label="Notifications"><h4>Notifications ${S.inbox.length ? '<button class="link" data-act="clearInbox">Clear</button>' : ''}</h4>${list}</div>`;
  S.unread = 0; renderBell(); queueSave();
}
function closePop(){ $('#pop').innerHTML = ''; }
function showModal(html, cls){ $('#modalRoot').innerHTML = `<div class="overlay"><div class="modal ${cls || ''}" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $('#modalRoot').innerHTML = ''; }
let confirmCb = null;
function confirmBox(o){
  confirmCb = o.onYes;
  showModal(`<div class="sys"><span>Confirm</span></div><h3>${esc(o.title)}</h3><p class="lead">${o.body}</p>
    <div class="center"><button class="btn ghost" data-act="cno">${esc(o.no || 'Cancel')}</button><button class="btn ${o.danger ? 'danger' : 'coral'}" data-act="cyes">${esc(o.yes || 'Yes')}</button></div>`, o.danger ? 'red' : '');
}
function levelFlash(lv){
  const el = document.createElement('div'); el.className = 'lvup';
  el.innerHTML = `<div><b>LEVEL UP</b><span>LEVEL ${lv}</span></div>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2300);
}
let AC = null;
function unlockAudio(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} }
function chime(kind){
  if (!S.settings.sound) return;
  try {
    unlockAudio(); if (!AC) return;
    const notes = kind === 'lvl' ? [523,659,784,1047] : kind === 'alarm' ? [784,988,784,988,1175,988,1175] : [660,880,990];
    notes.forEach((f,i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t = AC.currentTime + i*0.14;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.55);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.6);
    });
  } catch(e){}
}
function notifyDesktop(title, body, force, tag){
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || (!force && !document.hidden)) return false;
    const n = new Notification(title, {body, tag: tag || undefined, requireInteraction: !!force});
    n.onclick = () => { try { window.focus(); } catch(e){} n.close(); };
    return true;
  } catch(e){ return false; }
}
function notifState(){ if (!('Notification' in window)) return 'unsupported'; return Notification.permission; }
let flashTimer = null;
function flashTitle(text){
  if (!document.hidden || flashTimer) return;
  let on = false;
  flashTimer = setInterval(() => { document.title = on ? 'Hunter System' : text; on = !on; }, 1000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && flashTimer){ clearInterval(flashTimer); flashTimer = null; renderTimer(); } });

/* =========================================================
   ACTIONS
   ========================================================= */
const ACTIONS = {
  nav: go,
  fab: () => { if (S.timer.mode === 'focus' || inProgress()) { if (view !== 'home') go('home'); toggleTimer(); } else { go('home'); } },
  toggle: toggleTimer, abandon: abandonTimer, mode: setMode,
  pick: pickReward, claimq: claimQuest,
  closePenalty: () => { S.penalty = null; save(); closeModal(); render(); },
  stat: addStat,
  drink: k => { if (usePotion(k)){ toast('good','Potion', k === 'hp' ? 'HP restored by 50%.' : k === 'mp' ? 'MP restored by 50%.' : 'HP and MP fully restored.'); save(); render(); } },
  slot: s => { selSlot = s; renderView(true); },
  unequip, equip: equipItem, buy: buyItem, buyc: buyConsumable,
  goshop: c => { shopCat = c; go('shop'); },
  shopcat: c => { shopCat = c; renderView(true); },
  redeem,
  rrdel: id => { S.realRewards = S.realRewards.filter(r => r.id !== id); save(); renderView(true); },
  opengate: id => { selGate = id; go('gates'); },
  selgate: id => { selGate = id; renderView(true); },
  gate: enterGate, act, leave: leaveGate,
  title: id => { const a = ACH.find(x => x.id === id); if (a && S.ach.includes(id)){ S.title = a.title; save(); render(); } },
  rday: (d, el) => {
    d = +d; const i = formDays.indexOf(d);
    if (i >= 0) formDays.splice(i,1); else formDays.push(d);
    el.classList.toggle('on', formDays.includes(d)); el.setAttribute('aria-pressed', String(formDays.includes(d)));
  },
  rdays: k => {
    formDays = k === 'all' ? [0,1,2,3,4,5,6] : k === 'wk' ? [1,2,3,4,5] : [0,6];
    document.querySelectorAll('#remDays .dchip').forEach(b => { const on = formDays.includes(+b.dataset.arg); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  },
  rtoggle: id => { const r = S.reminders.find(x => x.id === id); if (!r) return; r.on = !r.on; if (r.on) S.reminderLog[r.id] = (new Date() >= remDate(r, new Date())) ? dayKey() : S.reminderLog[r.id]; save(); render(true); toast('info','Schedule', `${r.label} ${r.on ? 'is on' : 'is off'}.`); },
  redit: id => { const r = S.reminders.find(x => x.id === id); if (!r) return; editRem = id; formDays = r.days.slice(); renderView(true); const f = $('#remForm'); if (f) f.scrollIntoView({behavior:'smooth', block:'center'}); },
  rcancel: () => { editRem = null; formDays = [1,2,3,4,5]; renderView(true); },
  rdel: id => { const r = S.reminders.find(x => x.id === id); if (!r) return; confirmBox({title:`Delete "${r.label}"?`, body:'This reminder will stop ringing.', yes:'Delete', no:'Keep it', danger:true, onYes: () => { S.reminders = S.reminders.filter(x => x.id !== id); if (editRem === id) editRem = null; save(); render(true); }}); },
  rdismiss: () => closeModal(),
  rsnooze: id => { S.snooze = {id, at: Date.now() + 10*60000}; closeModal(); save(); toast('info','Snoozed','I will remind you again in 10 minutes.'); },
  rstart: startFromReminder,
  ics: icsExport,
  ntest: () => {
    const st = notifState();
    if (st === 'granted'){ notifyDesktop('Hunter System', 'Notifications work. Your study reminders will look like this.', true, 'test'); toast('good','Notifications','Test sent. Check the corner of your screen.'); }
    else if (st === 'default') ACTIONS.notif();
    else toast('warn','Notifications', st === 'denied' ? 'The browser is blocking notifications for this page. Allow them from the address bar, then reload.' : 'This browser does not support desktop notifications. In-app alerts and sound still work.');
    chime('alarm');
  },
  bell: () => { if ($('#pop .popover')) closePop(); else openPop(); },
  clearInbox: () => { S.inbox = []; S.unread = 0; save(); openPop(); },
  cyes: () => { const cb = confirmCb; confirmCb = null; closeModal(); if (cb) cb(); },
  cno: () => { confirmCb = null; closeModal(); },
  notif: () => {
    try {
      if (!('Notification' in window)){ toast('warn','Notifications','This browser does not support desktop notifications.'); return; }
      Notification.requestPermission().then(p => { toast(p === 'granted' ? 'good' : 'warn','Notifications', p === 'granted' ? 'Enabled. Sessions and study reminders will notify you.' : 'The browser blocked notifications.'); if (view === 'schedule') renderView(true); });
    } catch(e){ toast('warn','Notifications','Notifications cannot be enabled here.'); }
  },
  export: () => {
    try {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `hunter-system-${dayKey()}.json`; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('good','Backup','Backup file downloaded.');
    } catch(e){ toast('warn','Backup','Export failed in this browser.'); }
  },
  import: () => $('#importFile').click(),
  reset: () => confirmBox({title:'Start over from scratch?', body:'Every level, item, gold coin and session log will be erased. Export first if you want a backup.', yes:'Erase everything', no:'Cancel', danger:true,
    onYes: () => { S = defaults(); for (let i = 0; i < 4; i++) spawnGate(); view = 'home'; save(); render(true); openWelcome(); }}),
  accept: () => {
    const v = ($('#welcomeName').value || '').trim();
    S.name = v || 'Hunter'; S.init = true; save(); closeModal(); render(true);
    toast('info','System','Welcome, Player. Clear focus sessions to grow stronger.');
  }
};
document.addEventListener('click', e => {
  unlockAudio();
  const pop = $('#pop .popover');
  if (pop && !pop.contains(e.target) && !e.target.closest('#bellBtn')) closePop();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.arg, el);
});
document.addEventListener('input', e => { if (e.target.id === 'taskLabel'){ S.timer.label = e.target.value.slice(0,60); queueSave(); } });
document.addEventListener('submit', e => {
  if (e.target.id === 'remForm'){ e.preventDefault(); saveReminder(); return; }
  if (e.target.id !== 'rrForm') return;
  e.preventDefault();
  const name = ($('#rrName').value || '').trim(), cost = parseInt($('#rrCost').value, 10);
  if (!name || !Number.isFinite(cost) || cost < 10){ toast('warn','Rewards','Give the reward a name and a price of at least 10 gold.'); return; }
  S.realRewards.push({id:'rr' + Date.now().toString(36), name:name.slice(0,50), cost:Math.min(100000, cost)});
  save(); renderView(true); toast('good','Rewards',`Added "${name}".`);
});
document.addEventListener('change', e => {
  const id = e.target.id; if (!id || !id.startsWith('set')) return;
  const st = S.settings, num = (v,a,b,def) => { const n = parseInt(v,10); return Number.isFinite(n) ? clamp(n,a,b) : def; };
  if (id === 'setTitle'){ const a = ACH.find(x => x.id === e.target.value); if (a) S.title = a.title; save(); renderTop(); return; }
  if (id === 'setName') S.name = e.target.value.trim().slice(0,24) || 'Hunter';
  if (id === 'setFocus') st.focus = num(e.target.value,5,120,25);
  if (id === 'setShort') st.short = num(e.target.value,1,30,5);
  if (id === 'setLong') st.long = num(e.target.value,5,60,15);
  if (id === 'setTarget') st.target = num(e.target.value,1,16,4);
  if (id === 'setSound') st.sound = e.target.checked;
  if (id === 'setAuto') st.autoBreak = e.target.checked;
  if (['setFocus','setShort','setLong'].includes(id) && !inProgress()) S.timer.remaining = full(S.timer.mode);
  const map = {setFocus:'focus',setShort:'short',setLong:'long',setTarget:'target'};
  if (map[id]) e.target.value = st[map[id]];
  save(); renderRails(); renderTop(); renderTimer();
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data.level !== 'number' || !data.stats) throw new Error('format');
      S = merge(data); migrate(); S.init = true; save(); render(true);
      toast('good','Backup',`Restored ${S.name}, level ${S.level}.`);
    } catch(err){ toast('warn','Backup','File not recognized. Choose a .json file exported from this app.'); }
    e.target.value = '';
  };
  r.readAsText(f);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closePop(); return; }
  if (e.key === 'Enter' && e.target.id === 'welcomeName'){ ACTIONS.accept(); return; }
  if (e.code !== 'Space') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select','button'].includes(tag) || $('#modalRoot').children.length) return;
  e.preventDefault(); toggleTimer();
});
function openWelcome(){
  showModal(`
    <div class="sys"><span>System notice</span></div>
    <h3>You have qualified to become a Player.</h3>
    <p class="lead">Every focus session is a quest. Clear it to earn XP, gold and gate keys. Running from a quest has a price.</p>
    <label class="field" for="welcomeName"><span>Hunter name</span><input class="input" id="welcomeName" maxlength="24" placeholder="Enter your name"></label>
    <div class="center"><button class="btn coral" data-act="accept">Accept</button></div>`);
  setTimeout(() => { const i = $('#welcomeName'); if (i) i.focus(); }, 60);
}

/* =========================================================
   LOOP & BOOT
   ========================================================= */
function tick(){
  const T = S.timer;
  if (T.running && remainingNow() <= 0) completeTimer();
  else if (T.running) renderTimer();
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', tick);
setInterval(() => { if (S.lastSeen !== dayKey()){ dailyCheck(); render(); showPenalty(); } }, 30000);
setInterval(() => { checkReminders(); ambientGates(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ checkReminders(); ambientGates(); } });

clampVitals();
if (!S.gates.length){ for (let i = 0; i < 4; i++) spawnGate(); }
dailyCheck();
if (S.timer.running && remainingNow() <= 0) completeTimer();
save();
render(true);
if (!S.init) openWelcome();
else if (S.pending) openRewards();
else if (S.penalty) showPenalty();
if (S.init){ ambientGates(); checkReminders(); }
</script>
